<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Sign In | ShrimpGuard</title>
	<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="login-page">
<main class="login-shell">
	<section class="login-panel" aria-labelledby="login-title">
		<div class="login-brand">
			<span class="login-brand-mark" aria-hidden="true">🦐</span>
			<span>ShrimpGuard</span>
		</div>

		<p class="eyebrow">Secure access</p>
		<h1 id="login-title">Sign in</h1>
		<p class="login-intro">Use your account to continue.</p>

		{% if error %}
		<div class="login-error" role="alert">{{ error }}</div>
		{% endif %}

		<form class="login-form" method="post" action="{{ url_for('login') }}">
			<input type="hidden" name="csrf_token" value="{{ session['login_csrf_token'] }}">

			<label for="user-name">Username</label>
			<input id="user-name" name="user_name" type="text" autocomplete="username" maxlength="80" required autofocus>

			<label for="password">Password</label>
			<input id="password" name="password" type="password" autocomplete="current-password" required>

			<button type="submit">Sign in</button>
		</form>
	</section>
</main>
</body>
</html>
